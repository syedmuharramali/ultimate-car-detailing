<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0C0B0A" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!--
      Fonts load from here rather than an @import inside index.css.
      An @import is discovered only after the stylesheet has downloaded and
      parsed, so the chain is HTML -> index.css -> fonts.css -> font files.
      Declared here it starts during the initial HTML parse instead, and the
      preconnects warm both Google hosts while that happens.

      Big Shoulders ships 700 and 800 only — those are the two weights the
      design actually uses. It was requesting five.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600;700&display=swap"
    />

    <title>Ultimate Car Detailing | Mobile Detailing in the GTA</title>
    <meta
      name="description"
      content="Premium mobile car detailing in the GTA &amp; Surrounding Areas. We come to you. 500+ vehicles detailed."
    />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Ultimate Car Detailing | Mobile Detailing in the GTA" />
    <meta property="og:description" content="Premium mobile car detailing at your doorstep, GTA &amp; Surrounding Areas." />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Ultimate Car Detailing" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
